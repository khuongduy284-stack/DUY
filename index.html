<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kho VNT — Quản lý 5S</title>
<style>
  :root{
    --bg:#0e1116; --card:#171c24; --card2:#1f2630; --line:#2b3542;
    --ink:#eef2f6; --sub:#93a1b2; --mut:#657283;
    --grn:#33a06f; --grn-d:#0f6e56; --grn-bg:#12352a;
    --amb:#e0a020; --amb-bg:#3a2e0f; --red:#e2564f; --red-bg:#3a1614;
    --blu:#3d8fdd; --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;}
  .wrap{max-width:900px;margin:0 auto;padding:12px 12px 96px;}
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:8px;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--grn);color:#052015;
    font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;}
  h1{font-size:18px;margin:0;font-weight:700;}
  h1 small{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:.5px;}
  .lockbtn{margin-left:auto;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);font-size:19px;cursor:pointer;flex:0 0 auto;}
  .lockbtn.unlocked{background:var(--grn-bg);border-color:var(--grn-d);}
  body.readonly .bar .add,body.readonly #btnReset,body.readonly #btnImport{display:none;}
  body.readonly .newbtn,body.readonly #sDel{display:none!important;}
  .robanner{background:var(--grn-bg);color:var(--grn);font-size:12px;font-weight:600;text-align:center;
    padding:6px;border-radius:9px;margin-bottom:9px;border:1px solid var(--grn-d);}
  body:not(.readonly) .robanner{display:none;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;}
  .kpi .n{font-size:19px;font-weight:700;line-height:1.1;}
  .kpi .l{font-size:10.5px;color:var(--sub);margin-top:2px;}
  .kpi.on{border-color:var(--grn);background:var(--grn-bg);}
  .kpi.warn .n{color:var(--amb);} .kpi.err .n{color:var(--red);}
  .searchrow{display:flex;gap:7px;margin-bottom:9px;}
  .search{flex:1;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);
    color:var(--ink);padding:0 14px;font-size:16px;outline:none;}
  .search:focus{border-color:var(--grn);}
  .iconbtn{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);
    color:var(--sub);font-size:18px;cursor:pointer;flex:0 0 auto;}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);
    color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--grn);border-color:var(--grn);color:#052015;}
  .list{margin-top:12px;}
  .grp{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:16px 2px 8px;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;
    margin-bottom:8px;display:flex;gap:11px;align-items:center;cursor:pointer;transition:transform .07s;}
  .item:active{transform:scale(.99);}
  .vt{flex:0 0 auto;min-width:52px;height:44px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .vt b{font-size:13px;color:var(--grn);font-weight:700;} .vt span{font-size:9px;color:var(--mut);}
  .info{flex:1;min-width:0;}
  .info .ma{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .info .ten{font-size:12.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .info .meta{font-size:11px;color:var(--mut);margin-top:1px;}
  .qtybox{flex:0 0 auto;text-align:right;}
  .qtybox .q{font-size:17px;font-weight:700;} .qtybox .u{font-size:10px;color:var(--mut);}
  .qtybox.low .q{color:var(--amb);} .qtybox.zero .q{color:var(--red);}
  .empty{text-align:center;color:var(--mut);padding:40px 20px;font-style:italic;}
  mark{background:var(--amb);color:#1a1204;border-radius:3px;padding:0 2px;}

  .backdrop{position:fixed;inset:0;background:rgba(3,6,10,.65);z-index:40;display:none;}
  .backdrop.show{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:18px 18px 0 0;
    border-top:1px solid var(--line);padding:16px 16px 26px;transform:translateY(100%);
    transition:transform .22s cubic-bezier(.2,.7,.3,1);max-width:900px;margin:0 auto;max-height:88vh;overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;}
  .shd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .shd .pill{background:var(--grn-bg);color:var(--grn);font-weight:700;font-size:14px;padding:6px 13px;border-radius:9px;}
  .shd .x{margin-left:auto;width:36px;height:36px;border:none;background:var(--card2);color:var(--sub);
    border-radius:9px;font-size:20px;cursor:pointer;}
  .fl{display:block;font-size:11px;color:var(--sub);margin:0 0 5px 2px;text-transform:uppercase;letter-spacing:.5px;}
  .field{margin-bottom:13px;}
  .inp,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font-size:16px;padding:11px 12px;outline:none;font-family:inherit;}
  .inp:focus,textarea:focus{border-color:var(--grn);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .stepqty{display:flex;align-items:center;gap:8px;}
  .stepqty button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);font-size:22px;cursor:pointer;flex:0 0 auto;}
  .stepqty input{flex:1;text-align:center;font-size:20px;font-weight:700;height:46px;}
  .actions{display:flex;gap:9px;margin-top:8px;}
  .btn{flex:1;height:48px;border-radius:11px;border:none;font-size:16px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--grn);color:#052015;} .btn.primary:active{background:var(--grn-d);}
  .btn.ghost{flex:0 0 auto;width:52px;background:var(--card2);color:var(--red);}
  .newbtn{width:100%;height:46px;border-radius:11px;border:1px dashed var(--line);background:transparent;
    color:var(--sub);font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:900px;margin:0 auto;}
  .bar button{flex:1;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--ink);
    font-size:13px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .bar button span.ic{font-size:16px;} .bar button:active{background:var(--line);}
  .bar button.add{background:var(--grn);color:#052015;border-color:var(--grn);}
  .toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(20px);z-index:60;background:var(--grn);
    color:#052015;font-weight:700;font-size:14px;padding:11px 20px;border-radius:11px;opacity:0;pointer-events:none;transition:all .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--red);color:#fff;}
  input[type=file]{display:none;}
  .viewtoggle{display:flex;gap:6px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:4px;}
  .vt-btn{flex:1;height:38px;border:none;border-radius:9px;background:transparent;color:var(--sub);
    font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .vt-btn span{font-size:15px;}
  .vt-btn.on{background:var(--grn);color:#052015;}
  .mapview{margin-top:8px;}
  .shelf{margin-bottom:20px;}
  .shelf-hd{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .shelf-hd .badge{width:40px;height:40px;border-radius:10px;background:var(--grn-bg);color:var(--grn);
    font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .shelf-hd .nm{font-size:15px;font-weight:700;}
  .shelf-hd .nm small{display:block;font-size:11px;color:var(--sub);font-weight:400;}
  .shelf-frame{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px;}
  .floor-lbl{font-size:10px;color:var(--mut);letter-spacing:1px;margin:3px 2px 5px;}
  .floor-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px;}
  .floor-row:last-child{margin-bottom:2px;}
  .cbin{position:relative;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);
    min-height:72px;padding:7px 7px 6px;cursor:pointer;display:flex;flex-direction:column;transition:transform .07s;overflow:hidden;}
  .cbin:active{transform:scale(.96);}
  .cbin.has{background:#16302a;border-color:var(--grn-d);}
  .cbin.low{background:#33290d;border-color:#7a5c14;}
  .cbin.zero{background:#331614;border-color:#7a2420;}
  .cbin .code{font-size:11px;font-weight:800;color:var(--grn);letter-spacing:.3px;}
  .cbin.empty-b .code{color:var(--mut);}
  .cbin.low .code{color:var(--amb);} .cbin.zero .code{color:var(--red);}
  .cbin .cnt{font-size:10px;color:var(--sub);margin-top:1px;}
  .cbin .prod{font-size:10.5px;color:var(--ink);margin-top:3px;line-height:1.25;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .cbin .emptytag{font-size:10px;color:var(--mut);font-style:italic;margin-top:auto;}
  .cbin .nqty{position:absolute;top:5px;right:6px;font-size:9px;background:var(--line);color:var(--ink);
    border-radius:8px;padding:1px 5px;font-weight:700;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:2px 2px 14px;font-size:11px;color:var(--sub);}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line);}
  .lg-has{background:#16302a;border-color:var(--grn-d)!important;} .lg-low{background:#33290d;border-color:#7a5c14!important;}
  .lg-zero{background:#331614;border-color:#7a2420!important;} .lg-emp{background:var(--card2);}
  .binlist{margin-top:2px;}
  .binlist .bl-item{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .binlist .bl-item:active{background:var(--card2);}
  .bl-item .bma{font-size:14px;font-weight:600;} .bl-item .bten{font-size:12px;color:var(--sub);}
  .bl-item .bq{margin-left:auto;text-align:right;font-size:15px;font-weight:700;}
  .bl-item .bq small{display:block;font-size:9px;color:var(--mut);font-weight:400;}
  .modal{position:fixed;inset:0;z-index:70;background:rgba(3,6,10,.7);display:none;align-items:center;justify-content:center;padding:20px;}
  .modal.show{display:flex;}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%;}
  .modal h3{margin:0 0 8px;font-size:17px;} .modal p{color:var(--sub);font-size:13.5px;margin:0 0 16px;line-height:1.6;}
  .modal .mbtns{display:flex;gap:9px;} .modal .mbtns .btn{height:44px;font-size:15px;}
  .modal .btn.cancel{background:var(--card2);color:var(--sub);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo">VNT</div>
      <h1>Kho thiết bị điện<small>CÔNG TY TNHH MTV VNT VIỆT NAM — 5S</small></h1>
      <button id="lockBtn" class="lockbtn" aria-label="Khóa chỉnh sửa">🔒</button>
    </div>
    <div class="kpis">
      <div class="kpi on" data-f="all"><div class="n" id="k-all">0</div><div class="l">Tổng mã</div></div>
      <div class="kpi" data-f="stock"><div class="n" id="k-stock">0</div><div class="l">Còn hàng</div></div>
      <div class="kpi warn" data-f="low"><div class="n" id="k-low">0</div><div class="l">Sắp hết</div></div>
      <div class="kpi err" data-f="zero"><div class="n" id="k-zero">0</div><div class="l">Hết / trống</div></div>
    </div>
    <div class="robanner">🔒 Chế độ xem — tra cứu thoải mái, dữ liệu được bảo vệ. Bấm 🔒 góc trên để cập nhật.</div>
    <div class="viewtoggle">
      <button class="vt-btn on" id="vList"><span>☰</span> Danh sách</button>
      <button class="vt-btn" id="vMap"><span>▦</span> Sơ đồ kệ</button>
    </div>
    <div class="searchrow" id="searchrow">
      <input class="search" id="q" placeholder="🔎 Tìm mã, tên, vị trí, hãng...">
      <button class="iconbtn" id="scanClr" aria-label="Xóa">✕</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <div class="list" id="list"></div>
  <div class="mapview" id="mapview" style="display:none"></div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="shd"><span class="pill" id="sVt">—</span><span id="sTitle" style="font-size:13px;color:var(--sub)"></span>
    <button class="x" id="sClose">✕</button></div>
  <div class="field"><label class="fl">Mã thiết bị</label><input class="inp" id="sMa" placeholder="VD: MY4N-GS"></div>
  <div class="field"><label class="fl">Tên thiết bị</label><input class="inp" id="sTen" placeholder="VD: Relay trung gian"></div>
  <div class="two field">
    <div><label class="fl">Quy cách</label><input class="inp" id="sQuy" placeholder="24VDC"></div>
    <div><label class="fl">Nhãn hiệu</label><input class="inp" id="sHang" placeholder="OMRON"></div>
  </div>
  <div class="field"><label class="fl">Số lượng tồn</label>
    <div class="stepqty"><button id="qMinus">−</button><input class="inp" id="sSl" inputmode="numeric" value="0"><button id="qPlus">+</button></div>
  </div>
  <div class="two field">
    <div><label class="fl">Đơn vị</label><input class="inp" id="sDv" placeholder="PCS"></div>
    <div><label class="fl">Mức tối thiểu</label><input class="inp" id="sMin" inputmode="numeric" placeholder="—"></div>
  </div>
  <div class="field"><label class="fl">Vị trí kho</label><input class="inp" id="sVtEdit" placeholder="A-1-1"></div>
  <div class="actions">
    <button class="btn ghost" id="sDel">🗑</button>
    <button class="btn primary" id="sSave">Lưu</button>
  </div>
</div>

<div class="sheet" id="binSheet">
  <div class="grip"></div>
  <div class="shd"><span class="pill" id="bsCode">—</span>
    <span style="font-size:13px;color:var(--sub)">Thiết bị trong rổ</span>
    <button class="x" onclick="closeBinSheet()">✕</button></div>
  <div id="bsBody"></div>
  <button class="newbtn" id="bsAdd">＋ Thêm thiết bị vào rổ này</button>
</div>

<div class="bar">
  <button class="add" id="btnAdd"><span class="ic">＋</span>Thêm</button>
  <button id="btnExport"><span class="ic">⭳</span>Xuất</button>
  <button id="btnImport"><span class="ic">⭱</span>Nhập</button>
  <button id="btnPrint"><span class="ic">🖨</span>In/QR</button>
  <button id="btnReset"><span class="ic">↺</span>Gốc</button>
  <input type="file" id="fileIn" accept=".csv,.json,.txt">
</div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle"></h3><p id="mBody"></p>
  <div class="mbtns"><button class="btn cancel" id="mCancel">Hủy</button><button class="btn primary" id="mOk">Đồng ý</button></div>
</div></div>

var KEY="khoVNT_5s_v1";
var items=[]; var editIdx=-1; var filter="all"; var groupFilter="";

function loadStore(){
  try{var raw=localStorage.getItem(KEY);items=raw?JSON.parse(raw):JSON.parse(JSON.stringify(SEED));}
  catch(e){items=JSON.parse(JSON.stringify(SEED));}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
function num(x){var n=parseFloat(x);return isNaN(n)?null:n;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function toast(m,err){var t=document.getElementById('toast');t.textContent=m;t.className="toast show"+(err?" err":"");setTimeout(function(){t.className="toast";},1600);}

function groups(){var s=[];items.forEach(function(it){if(it.nhom&&s.indexOf(it.nhom)<0)s.push(it.nhom);});return s;}

function render(){
  var all=items.length;
  var stock=items.filter(function(it){return num(it.sl)!==null&&num(it.sl)>0;}).length;
  var low=items.filter(function(it){var q=num(it.sl),m=num(it.min);return q!==null&&m!==null&&q<=m&&q>0;}).length;
  var zero=items.filter(function(it){var q=num(it.sl);return q===null||q===0;}).length;
  document.getElementById('k-all').textContent=all;
  document.getElementById('k-stock').textContent=stock;
  document.getElementById('k-low').textContent=low;
  document.getElementById('k-zero').textContent=zero;
  document.querySelectorAll('.kpi').forEach(function(k){k.classList.toggle('on',k.getAttribute('data-f')===filter);});

  var chips=document.getElementById('chips');
  var gs=groups();
  chips.innerHTML='<div class="chip'+(groupFilter===""?" on":"")+'" data-g="">Tất cả kệ</div>'+
    gs.map(function(g){return '<div class="chip'+(groupFilter===g?" on":"")+'" data-g="'+esc(g)+'">'+esc(g)+'</div>';}).join("");
  chips.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){groupFilter=c.getAttribute('data-g');render();};});

  var q=document.getElementById('q').value.toLowerCase().trim();
  var rows=items.map(function(it,i){return {it:it,i:i};}).filter(function(o){
    var it=o.it;
    if(filter==="stock"&&!(num(it.sl)>0))return false;
    if(filter==="low"){var m=num(it.min),qq=num(it.sl);if(!(m!==null&&qq!==null&&qq<=m&&qq>0))return false;}
    if(filter==="zero"){var z=num(it.sl);if(!(z===null||z===0))return false;}
    if(groupFilter&&it.nhom!==groupFilter)return false;
    if(q){var hay=(it.ma+" "+it.ten+" "+it.vt+" "+it.hang+" "+it.quy+" "+it.nhom).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });

  var L=document.getElementById('list');
  if(rows.length===0){L.innerHTML='<div class="empty">Không tìm thấy thiết bị nào.<br>Thử xóa bộ lọc hoặc bấm ＋ Thêm.</div>';return;}
  rows.sort(function(a,b){return (a.it.vt||"zzz").localeCompare(b.it.vt||"zzz");});
  var html="",lastG=null;
  rows.forEach(function(o){
    var it=o.it;
    if(!q&&!groupFilter&&it.nhom!==lastG){lastG=it.nhom;html+='<div class="grp">'+esc(it.nhom||"KHÁC")+'</div>';}
    var qv=num(it.sl),mv=num(it.min);
    var cls="";if(qv===null||qv===0)cls="zero";else if(mv!==null&&qv<=mv)cls="low";
    function hl(s){if(!q)return esc(s);var e=esc(s);var idx=e.toLowerCase().indexOf(q);if(idx<0)return e;
      return e.slice(0,idx)+'<mark>'+e.slice(idx,idx+q.length)+'</mark>'+e.slice(idx+q.length);}
    var vtparts=(it.vt||"—").split('-');
    html+='<div class="item" data-i="'+o.i+'">'+
      '<div class="vt"><b>'+esc(it.vt||"—")+'</b><span>Kệ '+esc(vtparts[0]||"?")+'</span></div>'+
      '<div class="info"><div class="ma">'+hl(it.ma||it.ten||"(chưa đặt tên)")+'</div>'+
      '<div class="ten">'+hl(it.ten||"")+'</div>'+
      '<div class="meta">'+esc([it.quy,it.hang].filter(Boolean).join(" · "))+'</div></div>'+
      '<div class="qtybox '+cls+'"><div class="q">'+(qv===null?"–":qv)+'</div><div class="u">'+esc(it.dv||"")+'</div></div>'+
      '</div>';
  });
  L.innerHTML=html;
  L.querySelectorAll('.item').forEach(function(el){el.onclick=function(){openEdit(parseInt(el.getAttribute('data-i')));};});
}

function openEdit(i){
  editIdx=i;
  var it=i>=0?items[i]:{vt:"",ma:"",ten:"",quy:"",hang:"",sl:"0",dv:"PCS",min:"",nhom:groupFilter||""};
  document.getElementById('sVt').textContent=it.vt||"MỚI";
  document.getElementById('sMa').value=it.ma||"";
  document.getElementById('sTen').value=it.ten||"";
  document.getElementById('sQuy').value=it.quy||"";
  document.getElementById('sHang').value=it.hang||"";
  document.getElementById('sSl').value=it.sl||"0";
  document.getElementById('sDv').value=it.dv||"PCS";
  document.getElementById('sMin').value=it.min||"";
  document.getElementById('sVtEdit').value=it.vt||"";
  document.getElementById('sDel').style.display=i>=0?"block":"none";
  var ro=!unlocked;
  ['sMa','sTen','sQuy','sHang','sSl','sDv','sMin','sVtEdit'].forEach(function(id){document.getElementById(id).readOnly=ro;});
  document.getElementById('qPlus').style.display=ro?"none":"block";
  document.getElementById('qMinus').style.display=ro?"none":"block";
  document.getElementById('sSave').style.display=ro?"none":"block";
  document.getElementById('sTitle').textContent=ro?"Xem chi tiết":(i>=0?"Sửa thiết bị":"Thêm thiết bị");
  document.getElementById('backdrop').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){document.getElementById('backdrop').classList.remove('show');document.getElementById('sheet').classList.remove('show');editIdx=-1;}

document.getElementById('qPlus').onclick=function(){var e=document.getElementById('sSl');e.value=(num(e.value)||0)+1;};
document.getElementById('qMinus').onclick=function(){var e=document.getElementById('sSl');e.value=Math.max(0,(num(e.value)||0)-1);};

document.getElementById('sSave').onclick=function(){
  var obj={vt:document.getElementById('sVtEdit').value.trim().toUpperCase(),
    ma:document.getElementById('sMa').value.trim(),ten:document.getElementById('sTen').value.trim(),
    quy:document.getElementById('sQuy').value.trim(),hang:document.getElementById('sHang').value.trim(),
    sl:document.getElementById('sSl').value.trim(),dv:document.getElementById('sDv').value.trim()||"PCS",
    min:document.getElementById('sMin').value.trim(),
    nhom:editIdx>=0?items[editIdx].nhom:(groupFilter||document.getElementById('sHang').value.trim().toUpperCase()||"KHÁC")};
  if(!obj.ma&&!obj.ten){toast("Nhập ít nhất Mã hoặc Tên",true);return;}
  if(editIdx>=0)items[editIdx]=obj;else items.push(obj);
  save();render();closeSheet();toast("Đã lưu");
};
document.getElementById('sDel').onclick=function(){
  if(editIdx<0)return;
  confirmModal("Xóa thiết bị","Xóa vĩnh viễn thiết bị này khỏi kho?",function(){
    items.splice(editIdx,1);save();render();closeSheet();toast("Đã xóa");});
};
document.getElementById('sClose').onclick=closeSheet;
document.getElementById('backdrop').onclick=closeSheet;
document.getElementById('btnAdd').onclick=function(){openEdit(-1);};

document.querySelectorAll('.kpi').forEach(function(k){k.onclick=function(){filter=k.getAttribute('data-f');render();};});
document.getElementById('q').oninput=render;
document.getElementById('scanClr').onclick=function(){document.getElementById('q').value="";render();};

function confirmModal(title,body,onOk){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').textContent=body;
  var m=document.getElementById('modal');m.classList.add('show');
  document.getElementById('mCancel').onclick=function(){m.classList.remove('show');};
  document.getElementById('mOk').onclick=function(){m.classList.remove('show');onOk();};
}

function csvCell(x){x=(x==null?"":""+x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}
document.getElementById('btnExport').onclick=function(){
  var head=["Vị trí","Mã","Tên","Quy cách","Nhãn hiệu","Số Lượng","Đơn Vị","Mức tối thiểu","Nhóm"];
  var rows=[head].concat(items.map(function(it){return [it.vt,it.ma,it.ten,it.quy,it.hang,it.sl,it.dv,it.min||"",it.nhom];}));
  var csv=rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");
  downloadFile("kho-VNT-"+dateStr()+".csv","\ufeff"+csv,"text/csv");
};
function dateStr(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}

function downloadFile(name,content,mime){
  try{
    var blob=new Blob([content],{type:mime+";charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download=name;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
    toast("Đã xuất "+name);
  }catch(e){
    // Fallback for mobile browsers that block download
    var w=window.open("","_blank");
    if(w){w.document.write("<pre style='white-space:pre-wrap;font:14px monospace;padding:12px'>"+esc(content)+"</pre>");
      w.document.title=name;toast("Chép nội dung để lưu",false);}
    else{prompt("Sao chép nội dung sau và lưu thành file "+name,content);}
  }
}

document.getElementById('btnImport').onclick=function(){document.getElementById('fileIn').click();};
document.getElementById('fileIn').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var txt=r.result,imported=[];
      if(f.name.toLowerCase().slice(-5)===".json"){imported=JSON.parse(txt);}
      else{
        var lines=txt.replace(/^\ufeff/,"").split(/\r?\n/);
        lines.forEach(function(line,i){
          if(!line.trim())return;var c=parseCSV(line);
          if(i===0&&/vị trí|position/i.test(c[0]))return;
          imported.push({vt:(c[0]||"").trim(),ma:(c[1]||"").trim(),ten:(c[2]||"").trim(),
            quy:(c[3]||"").trim(),hang:(c[4]||"").trim(),sl:(c[5]||"").trim(),dv:(c[6]||"PCS").trim(),
            min:(c[7]||"").trim(),nhom:(c[8]||"KHÁC").trim()});
        });
      }
      if(imported.length===0){toast("File rỗng",true);return;}
      confirmModal("Nhập "+imported.length+" thiết bị","Thay thế toàn bộ dữ liệu kho hiện tại bằng file này?",function(){
        items=imported;save();filter="all";groupFilter="";document.getElementById('q').value="";render();
        toast("Đã nhập "+imported.length+" thiết bị");});
    }catch(err){toast("File không đọc được",true);}
  };
  r.readAsText(f);e.target.value="";
};
function parseCSV(line){var out=[],cur="",q=false;for(var i=0;i<line.length;i++){var ch=line[i];
  if(q){if(ch=='"'){if(line[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
  else{if(ch==','){out.push(cur);cur="";}else if(ch=='"')q=true;else cur+=ch;}}out.push(cur);return out;}

document.getElementById('btnReset').onclick=function(){
  confirmModal("Nạp danh sách gốc","Ghi đè toàn bộ dữ liệu hiện tại bằng danh sách thiết bị gốc từ Excel?",function(){
    items=JSON.parse(JSON.stringify(SEED));save();filter="all";groupFilter="";document.getElementById('q').value="";render();
    toast("Đã nạp danh sách gốc");});

var viewMode="list"; // list | map
var SHELVES=["A","B","C","D","E","F"];
var SHELF_NAME={A:"OMRON",B:"IDEC",C:"MITSUBISHI",D:"FUJI",E:"HANYOUNG · TOGI",F:"QUẠT/ĐÈN · COS · DÂY · MÁNG"};

document.getElementById('vList').onclick=function(){switchView("list");};
document.getElementById('vMap').onclick=function(){switchView("map");};
function switchView(m){
  viewMode=m;
  document.getElementById('vList').classList.toggle('on',m==="list");
  document.getElementById('vMap').classList.toggle('on',m==="map");
  document.getElementById('list').style.display=m==="list"?"block":"none";
  document.getElementById('mapview').style.display=m==="map"?"block":"none";
  document.getElementById('chips').style.display=m==="list"?"flex":"none";
  render();
}

function binStat(lst){
  if(lst.length===0)return "empty-b";
  var anyStock=false,anyZero=false,anyLow=false;
  lst.forEach(function(it){var q=num(it.sl),m=num(it.min);
    if(q===null||q===0)anyZero=true;else{anyStock=true;if(m!==null&&q<=m)anyLow=true;}});
  if(anyStock&&!anyZero&&anyLow)return "low";
  if(anyZero&&!anyStock)return "zero";
  if(anyLow)return "low";
  return "has";
}

function renderMap(){
  var q=document.getElementById('q').value.toLowerCase().trim();
  // group items by bin
  var byBin={};
  items.forEach(function(it,i){var k=(it.vt||"?-?-?").toUpperCase();(byBin[k]=byBin[k]||[]).push({it:it,i:i});});
  var M=document.getElementById('mapview');
  var html='<div class="legend">'+
    '<span><i class="lg-has"></i>Còn hàng</span><span><i class="lg-low"></i>Sắp hết</span>'+
    '<span><i class="lg-zero"></i>Hết/trống SL</span><span><i class="lg-emp"></i>Rổ trống</span></div>';
  SHELVES.forEach(function(s){
    // count items in this shelf
    var total=0;items.forEach(function(it){if((it.vt||"").toUpperCase().indexOf(s+"-")===0)total++;});
    html+='<div class="shelf"><div class="shelf-hd"><div class="badge">'+s+'</div>'+
      '<div class="nm">Kệ '+s+'<small>'+esc(SHELF_NAME[s]||"")+' · '+total+' thiết bị</small></div></div>'+
      '<div class="shelf-frame">';
    for(var t=1;t<=5;t++){
      html+='<div class="floor-lbl">TẦNG '+t+'</div><div class="floor-row">';
      for(var b=1;b<=4;b++){
        var code=s+"-"+t+"-"+b;
        var lst=(byBin[code]||[]).map(function(o){return o.it;});
        var st=binStat(lst);
        // search highlight: dim non-matching bins
        var dim="";
        if(q){var hit=lst.some(function(it){return (it.ma+" "+it.ten+" "+it.hang+" "+code).toLowerCase().indexOf(q)>=0;})||code.toLowerCase().indexOf(q)>=0;
          if(!hit)dim=";opacity:.28";}
        var tot=0;lst.forEach(function(it){var n2=num(it.sl);if(n2)tot+=n2;});
        var inner='<div class="code">'+code+'</div>';
        if(lst.length){
          inner+='<div class="cnt">'+lst.length+' loại</div>';
          var names=lst.map(function(it){return it.ma||it.ten;}).join(", ");
          inner+='<div class="prod">'+esc(names)+'</div>';
          if(tot)inner+='<div class="nqty">'+tot+'</div>';
        }else{inner+='<div class="emptytag">trống</div>';}
        html+='<div class="cbin '+st+'" data-code="'+code+'" style="'+dim.slice(1)+'">'+inner+'</div>';
      }
      html+='</div>';
    }
    html+='</div></div>';
  });
  M.innerHTML=html;
  M.querySelectorAll('.cbin').forEach(function(el){el.onclick=function(){openBin(el.getAttribute('data-code'));};});
}

function openBin(code){
  var members=[];items.forEach(function(it,i){if((it.vt||"").toUpperCase()===code)members.push({it:it,i:i});});
  document.getElementById('sVt').textContent=code;
  // reuse a lightweight bin sheet via the modal-like sheet is complex; use a dedicated sheet
  var s=document.getElementById('binSheet');
  document.getElementById('bsCode').textContent=code;
  var body=document.getElementById('bsBody');
  if(members.length===0){
    body.innerHTML='<div class="empty" style="padding:24px">Rổ này chưa có thiết bị.</div>';
  }else{
    body.innerHTML='<div class="binlist">'+members.map(function(o){
      var it=o.it,q=num(it.sl);var cls=q===null||q===0?"zero":"";
      return '<div class="bl-item" data-i="'+o.i+'"><div><div class="bma">'+esc(it.ma||it.ten||"(chưa tên)")+'</div>'+
        '<div class="bten">'+esc([it.ten,it.quy,it.hang].filter(Boolean).join(" · "))+'</div></div>'+
        '<div class="bq" style="'+(cls==="zero"?"color:var(--red)":"")+'">'+(q===null?"–":q)+'<small>'+esc(it.dv||"")+'</small></div></div>';
    }).join("")+'</div>';
  }
  body.querySelectorAll('.bl-item').forEach(function(el){el.onclick=function(){
    closeBinSheet();openEdit(parseInt(el.getAttribute('data-i')));};});
  document.getElementById('bsAdd').onclick=function(){closeBinSheet();openEdit(-1);
    setTimeout(function(){document.getElementById('sVtEdit').value=code;},50);};
  document.getElementById('backdrop').classList.add('show');
  s.classList.add('show');
}
function closeBinSheet(){document.getElementById('binSheet').classList.remove('show');
  document.getElementById('backdrop').classList.remove('show');}
window.closeBinSheet=closeBinSheet;

var _origRender=render;
render=function(){
  if(viewMode==="map"){
    // still update KPIs
    var all=items.length;
    var stock=items.filter(function(it){return num(it.sl)>0;}).length;
    var low=items.filter(function(it){var q=num(it.sl),m=num(it.min);return q!==null&&m!==null&&q<=m&&q>0;}).length;
    var zero=items.filter(function(it){var q=num(it.sl);return q===null||q===0;}).length;
    document.getElementById('k-all').textContent=all;
    document.getElementById('k-stock').textContent=stock;
    document.getElementById('k-low').textContent=low;
    document.getElementById('k-zero').textContent=zero;
    renderMap();
  }else{_origRender();}
};
var _origClose=closeSheet;
closeSheet=function(){_origClose();closeBinSheet();};

loadStore();

// ===== Chế độ khóa (chỉ xem) =====
var EDIT_PASS="vnt2025"; // mã mở khóa chỉnh sửa — bạn có thể đổi
var unlocked=false;
function applyLock(){
  document.body.classList.toggle('readonly',!unlocked);
  document.getElementById('lockBtn').textContent=unlocked?"🔓":"🔒";
  document.getElementById('lockBtn').classList.toggle('unlocked',unlocked);
}
document.getElementById('lockBtn').onclick=function(){
  if(unlocked){unlocked=false;applyLock();closeSheet();toast("Đã khóa — chế độ xem");return;}
  var p=prompt("Nhập mã quản lý để mở khóa chỉnh sửa:");
  if(p===null)return;
  if(p===EDIT_PASS){unlocked=true;applyLock();toast("Đã mở khóa — có thể chỉnh sửa");}
  else toast("Sai mã",true);
};
applyLock();

render();
</script>
